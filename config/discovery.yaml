# Weekly discovery of new tickers: three channels; more hits rank higher

# Channel 1: quant screen (Yahoo screener fields; all ANDed, plus a fixed region=us)
screen:
  - [gt, intradaymarketcap, 10000000000]          # Market cap > $10B
  - [gt, quarterlyrevenuegrowth.quarterly, 15]     # Quarterly revenue YoY > 15%
  - [btwn, peratio.lasttwelvemonths, 0, 30]        # 0 < P/E < 30
screen_size: 50

# Channel 2: themes / supply chains: a member hits when its drawdown from the 52-week high exceeds the threshold ("great companies on sale")
theme_max_from_high: -20
themes:
  AI infrastructure:
    tickers: [AMD, ARM, ANET, VRT, SMCI, MU, CEG, VST, ETN]
  Semiconductor equipment:
    tickers: [ASML, AMAT, LRCX, KLAC, TER]
  Cloud / software:
    tickers: [AMZN, ORCL, NOW, SNOW, CRM, DDOG]
  Energy / copper:
    tickers: [CVX, FCX, SCCO, COP, EOG]

# Channel 3: smart money
openinsider: true              # Market-wide insider cluster buys (openinsider.com/latest-cluster-buys)
insider_min_value: 500000
funds_13f:                     # SEC CIK: a new position or an add of ≥20% counts as a hit
  Berkshire Hathaway: 1067983
  Pershing Square: 1336528
  Appaloosa: 1656456
  Baupost: 1061768
  Scion: 1649339
  Duquesne Family Office: 1536411
  Lone Pine: 1061165
  Coatue: 1135730
min_funds_13f: 1
top_n: 10
