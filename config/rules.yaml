cooldown_hours: 24          # same rule + same ticker: push at most once per 24h
daily_cap_notice: 10        # Daily 🟡 cap; overflow is merged into one digest
quiet_hours: {start: "23:00", end: "07:00", tz: America/Los_Angeles}   # during quiet hours only push 🔴

# level: urgent=🔴 rings / notice=🟡 normal / log=⚪ not pushed
# kind: pct_change (one-day move ≥ threshold%) | level_cross (crosses a price level in watchlist.yaml)
# tier: holdings | watchlist | all
rules:
  - {id: holding_move_urgent, kind: pct_change, tier: holdings,  threshold: 8, level: urgent}
  - {id: holding_move,        kind: pct_change, tier: holdings,  threshold: 5, level: notice}
  - {id: watch_move,          kind: pct_change, tier: watchlist, threshold: 8, level: notice}
  - {id: watch_move_log,      kind: pct_change, tier: watchlist, threshold: 4, level: log}
  - {id: price_line,          kind: level_cross, tier: all, level: notice}

  # ---- Event rules (Phase 2)----
  # 8-K material events: M&A / completed acquisition / restatement / officer change / bankruptcy / delisting
  - {id: 8k_material, kind: filing_8k, tier: holdings, items: ["1.01", "1.03", "2.01", "3.01", "4.02", "5.02"], level: urgent}
  - {id: 8k_watch,    kind: filing_8k, tier: watchlist, items: ["1.01", "1.03", "2.01", "3.01", "4.02", "5.02"], level: notice}
  # Insider open-market buys (sells are too common; not pushed)
  - {id: insider_buy,     kind: insider_buy, tier: all, min_value: 1000000, level: notice}
  - {id: insider_cluster, kind: insider_cluster, tier: all, min_insiders: 2, days: 30, level: urgent}
  # Earnings: actual vs expected
  - {id: earnings, kind: earnings, tier: all, level: notice}
  # Prediction-market 24h probability change (single contract). CPI / unemployment / GDP are dozens of"above X%" ladders; every rung jumps sharply around data releases,
  # pushing each rung would flood notifications → exclude_series excludes them; watch the implied-value change on the Macro page instead. Recession (KXRECSSNBER) is a single contract, so it stays.
  - {id: prob_shift, kind: prob_shift, threshold_pp: 15, hours: 24, level: notice,
     exclude_series: [KXCPIYOY, KXCPICOREYOY, KXU3, KXGDP]}
  # Macro thresholds (cross: previous observation ≤ threshold < latest observation; at most once per observation date)
  - {id: vix_30,  kind: macro_cross, series: VIXCLS, above: 30, label: VIX, level: notice}
  - {id: curve_0, kind: macro_cross, series: T10Y2Y, below: 0, label: 10Y-2Y spread, level: notice}
  - {id: stlfsi_0, kind: macro_cross, series: STLFSI4, above: 0, label: St. Louis Fed financial stress index turns positive (stress above normal), level: notice}
  - {id: nfci_0,   kind: macro_cross, series: NFCI, above: 0, label: Chicago Fed financial conditions turn positive (tighter than average), level: notice}
  - {id: icsa_250k, kind: macro_cross, series: ICSA, above: 250000, label: Initial jobless claims, level: notice}
  # Macro jumps (macro_change):
  #   vs: avg  → latest value vs the mean of the previous window observations, change ≥ pct% (at most once per new observation)
  #   vs: days → latest value vs the observation days days ago, absolute change ≥ abs (same units as the series; at most once per ISO week)
  - {id: icsa_jump,   kind: macro_change, series: ICSA, vs: avg, window: 4, pct: 10, direction: up, label: Initial jobless claims, level: notice}
  - {id: t10yie_move, kind: macro_change, series: T10YIE, vs: days, days: 7, abs: 0.15, label: 10Y breakeven inflation, level: notice}

# Heartbeat: a task has not succeeded for more than N hours → push 🟡
heartbeat:
  prices: 30
  edgar: 30
  macro: 30
  markets: 3
  earnings: 30
  discover: 192
  weekly: 192
  brief: 96
  reddit: 14
