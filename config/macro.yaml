# Macro"actuals"— FRED series id → display name (keyless CSV, fetched daily by the macro task)
fred:
  DFEDTARU: Fed funds upper bound
  DGS10: 10Y Treasury
  DGS2: 2Y Treasury
  T10Y2Y: 10Y-2Y spread
  SOFR: SOFR
  T5YIE: 5Y breakeven inflation
  T10YIE: 10Y breakeven inflation
  T5YIFR: 5Y5Y forward inflation
  DFII10: 10Y real yield
  ICSA: Initial jobless claims
  CCSA: Continuing claims
  WEI: NY Fed Weekly Economic Index
  IHLIDXUS: Indeed job postings index
  MORTGAGE30US: 30Y mortgage rate
  NFCI: Chicago Fed financial conditions
  STLFSI4: St. Louis Fed financial stress index
  BAMLH0A0HYM2: High-yield spread
  VIXCLS: VIX
  DTWEXBGS: Dollar index (broad)
  DEXCAUS: USD/CAD
  DCOILWTICO: WTI crude
  GDPNOW: Atlanta Fed GDPNow
  CPIAUCSL: CPI index
  UNRATE: Unemployment rate

# Macro page groups (listed order = display order; series not in any group go under “Other”)
fred_groups:
  Rates & inflation expectations: [DFEDTARU, SOFR, DGS2, DGS10, T10Y2Y, DFII10, T5YIE, T10YIE, T5YIFR]
  Real economy · Weekly: [ICSA, CCSA, WEI, IHLIDXUS, MORTGAGE30US]
  Financial conditions: [NFCI, STLFSI4, BAMLH0A0HYM2, VIXCLS, DTWEXBGS, DEXCAUS, DCOILWTICO]
  Nowcast: [GDPNOW]
  Monthly (lagging): [CPIAUCSL, UNRATE]

# Macro"Expected" (leading): prediction markets
markets:
  # A string = ticker only; or {series, label, max_events}. Tickers come from the Kalshi public API /series?category=Economics
  kalshi_series:
    - KXFED                                                    # Fed post-meeting upper-bound ladder contracts
    - {series: KXCPIYOY, label: CPI YoY, max_events: 2}
    - {series: KXCPICOREYOY, label: Core CPI YoY, max_events: 2}
    - {series: KXU3, label: Unemployment rate, max_events: 1}
    - {series: KXGDP, label: Real GDP growth (SAAR), max_events: 2}
    - {series: KXRECSSNBER, label: US recession (NBER), max_events: 2}
  kalshi_max_events: 3            # Default: the next 3 events (KXFED = 3 FOMC meetings)
  polymarket_tags: [fed-rates]     # "economy" is too noisy (includes political gossip); keep Fed only
  polymarket_max_events: 10
  shift_hours: 24
